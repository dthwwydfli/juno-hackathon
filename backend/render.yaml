# Render Blueprint — deploy FastAPI from backend/ (Root Directory = backend in UI if not using blueprint path)
services:
  - type: web
    name: juno-meds-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MEDDATA_API_KEY
        sync: false
      - key: TRUD_API_KEY
        sync: false
      - key: TRUD_DMD_ITEM_ID
        sync: false
      - key: OPENFDA_API_KEY
        sync: false
      - key: DMD_DB_PATH
        value: /app/data/dmd.sqlite
      - key: APP_DB_PATH
        value: /app/data/app.sqlite
      - key: APP_DATABASE_URL
        sync: false
