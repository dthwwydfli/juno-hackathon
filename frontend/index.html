<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Every medication you take, in one pocket. Track NHS, private and OTC medicines, spot potential interactions, and share a summary with your GP." />
    <title>Pocketary</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var gp = q.get('gp');
          if (gp && (location.pathname === '/' || location.pathname === '')) {
            location.replace('/gp/' + encodeURIComponent(gp));
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
